name: Publish Release Announcements

on:
  pull_request:
    types: [closed]
    branches:
      - master

# Only ever one publish in flight per version, so two runs can't race past the
# already-published check below and both post.
concurrency:
  group: publish-announcements-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish announcements to Slack
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release-announcements/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Extract version from branch name
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          VERSION="${BRANCH#release-announcements/}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "PUBLISHED_TAG=announcements-published/${VERSION}" >> $GITHUB_ENV

      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      # Posting is not undoable, so refuse to post twice for the same version.
      # A revert and re-merge of an announcements PR fires this workflow again.
      - name: Check whether this version was already published
        id: guard
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ env.PUBLISHED_TAG }}" >/dev/null 2>&1; then
            echo "already=true" >> $GITHUB_OUTPUT
            echo "::notice::${{ env.PUBLISHED_TAG }} already exists. Announcements for ${{ env.VERSION }} went out already, skipping."
          else
            echo "already=false" >> $GITHUB_OUTPUT
          fi

      - name: Verify announcement files exist
        if: steps.guard.outputs.already == 'false'
        run: |
          BASE="docs/release-notes/${{ env.VERSION }}/announcements"
          for f in social.md slack.md; do
            if [ ! -f "$BASE/$f" ]; then
              echo "Missing $BASE/$f — nothing to publish."
              exit 1
            fi
          done

      - name: "Post social announcement to #build-in-public"
        if: steps.guard.outputs.already == 'false'
        env:
          SLACK_USER_TOKEN: ${{ secrets.SLACK_USER_TOKEN }}
          CHANNEL_ID: C09LLSR96KU
        run: |
          BASE="docs/release-notes/${{ env.VERSION }}/announcements"
          # Append the #release-post tag — a downstream job watches for it and cross-posts to X / LinkedIn.
          TEXT=$(jq -rn --rawfile body "$BASE/social.md" \
            '($body | rtrimstr("\n")) + "\n\n#release-post"')
          .github/scripts/post-to-slack.sh "$TEXT"

      - name: Post Slack announcement to community Announcements
        if: steps.guard.outputs.already == 'false'
        env:
          # The community workspace is a separate Slack, so it has its own token
          # and its channel id lives in a repository variable.
          SLACK_USER_TOKEN: ${{ secrets.SLACK_COMMUNITY_USER_TOKEN }}
          CHANNEL_ID: ${{ vars.SLACK_COMMUNITY_CHANNEL_ID }}
        run: |
          BASE="docs/release-notes/${{ env.VERSION }}/announcements"
          # Convert literal @channel to the Slack broadcast token so the ping fires.
          TEXT=$(jq -rn --rawfile body "$BASE/slack.md" \
            '$body | gsub("@channel"; "<!channel>")')
          .github/scripts/post-to-slack.sh "$TEXT"

      # Written only after both posts succeed, so a partial failure stays retryable.
      - name: Mark this version as published
        if: steps.guard.outputs.already == 'false'
        run: |
          git tag "${{ env.PUBLISHED_TAG }}"
          git push origin "${{ env.PUBLISHED_TAG }}"
